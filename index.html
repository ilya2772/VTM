<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VTM — в разработке</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #e9f2ff; }
      main { width: min(720px, calc(100% - 40px)); padding: 48px; border: 1px solid #1b3657; border-radius: 24px; background: linear-gradient(145deg, #0c2037, #091523); box-shadow: 0 24px 80px #0007; }
      .eyebrow { color: #64d8a3; letter-spacing: .16em; font-size: 12px; text-transform: uppercase; }
      h1 { margin: 14px 0 12px; font-size: clamp(42px, 8vw, 78px); line-height: .95; }
      p { max-width: 560px; color: #a9bed6; font-size: 18px; line-height: 1.6; }
      .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; padding: 12px 16px; border-radius: 999px; background: #102d35; color: #a6f1c6; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #54e39b; box-shadow: 0 0 16px #54e39b; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">VTM / Axiom Prop Terminal</div>
      <h1>Проект запущен.</h1>
      <p>Это первая публичная версия VTM. Здесь будет развёрнут интерфейс виртуального проп-трейдингового терминала. Обновления будут появляться автоматически после отправки изменений в GitHub.</p>
      <div class="status"><span class="dot"></span> Среда разработки онлайн</div>
    </main>
  </body>
</html>
